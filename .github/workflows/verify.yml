name: Stock Watchdog verification
on:
  push:
    branches: [feature/stock-watchdog-v01]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE: ''
      - name: Save visual previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-watchdog-previews
          path: |
            test-results/desktop.png
            test-results/mobile.png
          if-no-files-found: warn
          retention-days: 7
